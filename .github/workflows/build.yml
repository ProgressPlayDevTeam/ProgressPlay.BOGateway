name: Build Pull Request

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ dev, main ]

jobs:
  ci:
    uses: ProgressPlayDevTeam/Pipelines/.github/workflows/build.yml@v1
    if: |
      !(
      github.head_ref == 'dev' && github.base_ref == 'main'
      )
    permissions:
      actions: write
      contents: read
    secrets: inherit
    with:
      image: bogateway
